name: probe

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cc -Wall -Wextra -Werror -o lockprobe probe/lockprobe.c
      - run: mkdir -p "$RUNNER_TEMP/probe" && ./lockprobe "$RUNNER_TEMP/probe"

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build with MSVC
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          cmd /c "`"$vs\VC\Auxiliary\Build\vcvarsall.bat`" ${{ matrix.arch }} && cl /nologo /W4 /WX probe\lockprobe.c /Fe:lockprobe.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\probe" | Out-Null
          .\lockprobe.exe "$env:RUNNER_TEMP\probe"
